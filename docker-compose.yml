# COSCUP 2026 · Building a MySQL-based RAG System from Scratch
# Services:
#   mysql    — MySQL 9.7 Community (VECTOR type is the star)
#   pg       — PostgreSQL 18 + pgvector 0.8 (control group)
#   ollama   — local embedding (bge-m3) and LLM (qwen3:4b), profile: ai
#   myvector — (optional) MyVector plugin MySQL, the third path, profile: myvector
#
# Quick start:
#   docker compose up -d                 # databases only
#   docker compose --profile ai up -d    # include Ollama

services:
  mysql:
    image: mysql:9.7
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: coscup2026
      MYSQL_DATABASE: ragdemo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=2G
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcoscup2026"]
      interval: 5s
      timeout: 3s
      retries: 20

  pg:
    image: pgvector/pgvector:pg18-bookworm
    container_name: rag-pg
    shm_size: 1g          # needed for parallel HNSW index builds; default 64MB hits DiskFull
    environment:
      POSTGRES_PASSWORD: coscup2026
      POSTGRES_DB: ragdemo
    ports:
      - "5432:5432"
    volumes:
      # PG 18 image volume mount is now /var/lib/postgresql (not …/data)
      - pg-data:/var/lib/postgresql
      - ./pgvector/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # After first start:
    #   docker exec rag-ollama ollama pull bge-m3     # embedding, 1024 dims
    #   docker exec rag-ollama ollama pull qwen3:4b   # answering LLM (Chinese-capable)

  # Third path (optional): MyVector = open-source GPLv2 MySQL vector plugin (HNSW ANN)
  # Image and usage: https://github.com/askdba/myvector — sketch:
  # myvector:
  #   image: ghcr.io/askdba/myvector:mysql9.7
  #   profiles: ["myvector"]
  #   environment:
  #     MYSQL_ROOT_PASSWORD: coscup2026
  #     MYSQL_DATABASE: ragdemo
  #   ports:
  #     - "3307:3306"

volumes:
  mysql-data:
  pg-data:
  ollama-data:
